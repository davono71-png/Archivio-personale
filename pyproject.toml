[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-drive-archiver"
version = "0.1.0"
description = "CLI per archiviare automaticamente email Gmail e documenti Google Drive personali."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Archivio personale maintainers" }
]
dependencies = [
  "google-api-python-client>=2.0",
  "google-auth-httplib2>=0.2",
  "google-auth-oauthlib>=1.2",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = []

[project.scripts]
gmail-drive-archiver = "gmail_drive_archiver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
