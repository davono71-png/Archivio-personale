services:
  postgres:
    image: postgres:16-alpine
    container_name: personal-archive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_archive}
      POSTGRES_USER: ${POSTGRES_USER:-archive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archive_change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: personal-archive-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-personal_archive}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-archive}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-archive_change_me}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-replace-this-with-a-long-random-string}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./config:/workspace/config:ro
      - ./database:/workspace/database
      - ./scripts:/workspace/scripts:ro

  ocr-worker:
    build:
      context: .
      dockerfile: docker/ocr/Dockerfile
    container_name: personal-archive-ocr-worker
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - ./config:/workspace/config:ro
      - ./database:/workspace/database
    environment:
      TZ: ${TZ:-Europe/Rome}

  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: personal-archive-anythingllm
    profiles: ["ai"]
    restart: unless-stopped
    depends_on:
      - ollama
    cap_add:
      - SYS_ADMIN
    ports:
      - "${ANYTHINGLLM_PORT:-3001}:3001"
    environment:
      STORAGE_DIR: /app/server/storage
      OLLAMA_BASE_PATH: ${OLLAMA_BASE_PATH:-http://ollama:11434}
      OLLAMA_MODEL_PREF: ${OLLAMA_MODEL_PREF:-llama3.2:3b}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - ./anythingllm/storage:/app/server/storage
      - ./database/anythingllm-import:/workspace/anythingllm-import:ro

  ollama:
    image: ollama/ollama:latest
    container_name: personal-archive-ollama
    profiles: ["ai"]
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}

  dashboard:
    image: nginx:1.27-alpine
    container_name: personal-archive-dashboard
    profiles: ["ui"]
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

  dashboard-api:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: personal-archive-dashboard-api
    profiles: ["ui"]
    restart: unless-stopped
    ports:
      - "${DASHBOARD_API_PORT:-8090}:8090"
    volumes:
      - ./database:/workspace/database

volumes:
  n8n-data:
  postgres-data:
  ollama-data:
